services:
  db:
    image: postgres:15-alpine
    container_name: pulsewatch-db
    environment:
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: pulsewatch_dev
      POSTGRES_DB: pulsewatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsewatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsewatch

  redis:
    image: redis:7-alpine
    container_name: pulsewatch-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsewatch

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pulsewatch-api
    environment:
      DATABASE_URL: postgresql://pulsewatch:pulsewatch_dev@db:5432/pulsewatch
      DATABASE_POOL_SIZE: 20
      DATABASE_MAX_OVERFLOW: 10
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_WORKERS: 4
      DEBUG: "True"
      SECRET_KEY: your-super-secret-key-change-in-prod-min-32-chars
      API_KEY: pulsewatch_dev_key_change_in_prod

      CORS_ORIGINS: '["http://localhost","http://localhost:80","http://127.0.0.1","http://127.0.0.1:80","http://localhost:8000","http://127.0.0.1:8000","http://frontend:80","http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000","http://127.0.0.1:3000","https://anomix-omega.vercel.app"]'

      ANOMALY_DETECTION_METHOD: isolation_forest
      Z_SCORE_THRESHOLD: 3.0
      ISOLATION_FOREST_CONTAMINATION: 0.1
      MIN_SAMPLES_FOR_DETECTION: 50
      EVAL_THRESHOLD_CONFIDENCE: 0.5
      LOG_LEVEL: INFO
      METRICS_RETENTION_DAYS: 30
      ANOMALY_AGGREGATION_WINDOW_MINUTES: 5
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "false"
      WS_HEARTBEAT_INTERVAL: 30
      WS_MAX_CONNECTIONS: 1000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsewatch
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pulsewatch-frontend
    ports:
      - "80:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsewatch

volumes:
  postgres_data:

networks:
  pulsewatch:
    driver: bridge